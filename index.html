<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1b1512" />
    <meta name="description" content="مكتبة زِيكولا للروايات وملفات PDF" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
    <title>زِيكولا | مكتبة الروايات</title>
  </head>
  <body>
    <div id="app" class="app-shell">
      <aside class="sidebar" aria-label="التنقل الرئيسي">
        <a class="brand" href="#home" aria-label="زِيكولا - الصفحة الرئيسية">
          <span class="brand-mark">ز</span>
          <span><strong>القبعة البيضاء</strong><small>مكتبة الروايات</small></span>
        </a>
        <nav class="side-nav">
          <button class="nav-link active" data-view="home"><span>⌂</span>الرئيسية</button>
          <button class="nav-link" data-view="library"><span>▦</span>المكتبة</button>
          <button class="nav-link" data-view="history"><span>◷</span>سجل القراءة</button>
          <button class="nav-link" data-view="settings"><span>⚙</span>الإعدادات</button>
        </nav>
        <div class="sidebar-foot">
          <div class="storage-meter"><div><span>محتوى المكتبة</span><b id="storageText">جارٍ الحساب…</b></div><i><em id="storageBar"></em></i></div>
          <p>تُحدَّث المكتبة تلقائيًا عند إضافة روايات جديدة.</p>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <button class="mobile-menu icon-button" id="menuButton" aria-label="فتح القائمة">☰</button>
          <div class="mobile-logo">القبعة البيضاء</div>
          <label class="global-search" for="globalSearch"><span>⌕</span><input id="globalSearch" type="search" placeholder="ابحث في الروايات…" autocomplete="off" /></label>
          <div class="top-actions">
            <button class="icon-button" id="themeToggle" title="تبديل مظهر التطبيق" aria-label="تبديل المظهر">☾</button>
            <button class="profile-chip" data-view="settings" title="الإعدادات"><span id="profileInitial">ق</span><b>قارئ</b></button>
          </div>
        </header>
        <div id="viewRoot" class="view-root" tabindex="-1"></div>
      </main>
    </div>

    <nav class="bottom-nav" aria-label="التنقل على الهاتف">
      <button class="bottom-link active" data-view="home">⌂<span>الرئيسية</span></button>
      <button class="bottom-link" data-view="library">▦<span>المكتبة</span></button>
      <button class="bottom-link" data-view="history">◷<span>السجل</span></button>
      <button class="bottom-link" data-view="settings">⚙<span>الإعدادات</span></button>
    </nav>

    <section id="reader" class="reader hidden" aria-label="قارئ PDF">
      <header class="reader-toolbar">
        <div class="reader-title"><button id="closeReader" class="icon-button" aria-label="العودة إلى الكتاب">→</button><span><small id="readerBookTitle">الكتاب</small><b id="readerChapterTitle">الحلقة</b></span></div>
        <div class="reader-controls">
          <div class="reader-themes" role="group" aria-label="لون القارئ"><button class="reader-theme active" data-reader-theme="paper" title="أبيض"></button><button class="reader-theme brown" data-reader-theme="sepia" title="بني"></button><button class="reader-theme dark" data-reader-theme="night" title="داكن"></button></div>
          <label class="page-jump">صفحة <input id="pageNumber" inputmode="numeric" type="number" min="1" value="1" /></label>
          <button class="icon-button" id="fullscreenButton" title="ملء الشاشة" aria-label="ملء الشاشة">⛶</button>
        </div>
      </header>
      <div id="readerStage" class="reader-stage paper"><div id="noPdf" class="reader-empty"><span>⌁</span><h2>ملف الحلقة غير متاح</h2><p>لم يُرفق ملف PDF لهذه الحلقة بعد.</p></div><iframe id="pdfFrame" title="قارئ PDF" class="hidden"></iframe></div>
      <footer class="reader-footer"><button class="reader-next" id="nextChapter">الحلقة التالية <span>←</span></button><span id="readerProgress">يتم حفظ موقعك تلقائيًا</span></footer>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="library.js"></script>
    <script src="app.js"></script>
  </body>
</html>
